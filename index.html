<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Primal Lux Agency</title>
    <style>
        /* ───────── RESET & BASE ───────── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b0b0f;
            padding: 20px;
            background-image: radial-gradient(circle at 20% 30%, rgba(99, 102, 241, 0.08) 0%, transparent 60%),
                              radial-gradient(circle at 80% 70%, rgba(236, 72, 153, 0.06) 0%, transparent 60%);
        }

        /* ───────── CARD ───────── */
        .card {
            max-width: 400px;
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 48px;
            padding: 44px 28px 36px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.04);
            text-align: center;
            transition: all 0.3s ease;
        }

        /* ───────── AVATAR / LOGO ───────── */
        .avatar-wrap {
            position: relative;
            width: 96px;
            height: 96px;
            margin: 0 auto 18px;
        }

        .avatar-ring {
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #f59e0b, #ec4899, #8b5cf6, #f59e0b);
            opacity: 0.6;
            animation: spin 10s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .avatar {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(145deg, #1a1a2e, #16213e);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            border: 2px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
        }

        /* ───────── TYPOGRAPHY ───────── */
        .name {
            color: #ffffff;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.3px;
            margin-bottom: 4px;
            background: linear-gradient(135deg, #fbbf24, #f59e0b, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .badge {
            display: inline-block;
            background: rgba(245, 158, 11, 0.15);
            color: #fbbf24;
            font-size: 12px;
            font-weight: 500;
            padding: 4px 14px;
            border-radius: 100px;
            border: 1px solid rgba(245, 158, 11, 0.15);
            margin-bottom: 16px;
            letter-spacing: 0.3px;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.45);
            font-size: 14px;
            font-weight: 400;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .subtitle span {
            color: rgba(255, 255, 255, 0.6);
        }

        /* ───────── DIVIDER ───────── */
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }
        .divider-line {
            flex: 1;
            height: 1px;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.08), transparent);
        }
        .divider-text {
            color: rgba(255, 255, 255, 0.2);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* ───────── BUTTONS ───────── */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 17px 20px;
            border-radius: 60px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            color: #fff;
            transition: all 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
            overflow: hidden;
            border: none;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn .icon {
            font-size: 22px;
            line-height: 1;
            width: 28px;
            text-align: center;
            flex-shrink: 0;
        }

        .btn .label {
            flex: 1;
            text-align: center;
        }

        .btn .arrow {
            opacity: 0.5;
            font-size: 14px;
            transition: opacity 0.2s;
        }

        .btn:hover .arrow {
            opacity: 1;
        }

        /* ── WhatsApp ── */
        .btn-whatsapp {
            background: linear-gradient(135deg, #25d366, #128c7e);
            box-shadow: 0 8px 28px rgba(37, 211, 102, 0.2);
        }
        .btn-whatsapp:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(37, 211, 102, 0.35);
        }

        /* ── Instagram ── */
        .btn-instagram {
            background: linear-gradient(135deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            box-shadow: 0 8px 28px rgba(225, 48, 108, 0.2);
        }
        .btn-instagram:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(225, 48, 108, 0.35);
        }

        /* ── Telegram ── */
        .btn-telegram {
            background: linear-gradient(135deg, #0088cc, #005a8c);
            box-shadow: 0 8px 28px rgba(0, 136, 204, 0.2);
        }
        .btn-telegram:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(0, 136, 204, 0.35);
        }

        /* ───────── FOOTER ───────── */
        .footer {
            margin-top: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            color: rgba(255, 255, 255, 0.15);
            font-size: 12px;
            letter-spacing: 0.5px;
        }

        .footer .dot {
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
        }

        .footer .status {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .footer .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #34d399;
            animation: pulse-dot 2s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }

        /* ───────── RESPONSIVE TWEAKS ───────── */
        @media (max-width: 440px) {
            .card {
                padding: 32px 20px 28px;
                border-radius: 36px;
            }

            .avatar-wrap {
                width: 80px;
                height: 80px;
            }

            .avatar {
                font-size: 34px;
            }

            .name {
                font-size: 22px;
            }

            .btn {
                padding: 15px 16px;
                font-size: 15px;
                gap: 12px;
            }

            .btn .icon {
                font-size: 20px;
                width: 24px;
            }
        }

        @media (max-width: 360px) {
            .card {
                padding: 24px 16px 20px;
            }

            .btn {
                padding: 13px 12px;
                font-size: 14px;
                gap: 10px;
            }

            .btn .icon {
                font-size: 18px;
                width: 20px;
            }

            .subtitle {
                font-size: 13px;
            }
        }

        /* ───────── SAFE AREA ───────── */
        @supports (padding: max(0px)) {
            .card {
                padding-left: max(28px, env(safe-area-inset-left));
                padding-right: max(28px, env(safe-area-inset-right));
            }
        }

        /* ───────── REDUCED MOTION ───────── */
        @media (prefers-reduced-motion: reduce) {
            .avatar-ring {
                animation: none;
            }
            .btn:hover {
                transform: none !important;
            }
            .footer .status-dot {
                animation: none;
            }
        }
    </style>
</head>
<body>

<div class="card">

    <!-- Avatar -->
    <div class="avatar-wrap">
        <div class="avatar-ring"></div>
        <div class="avatar">✨</div>
    </div>

    <!-- Name & Badge -->
    <h1 class="name">Primal Lux Agency</h1>
    <div class="badge">✦ Premium Service</div>

    <!-- Subtitle -->
    <p class="subtitle">
        <span>Let's elevate your brand!</span> — Connect with us below.
    </p>

    <!-- Divider -->
    <div class="divider">
        <span class="divider-line"></span>
        <span class="divider-text">Contact</span>
        <span class="divider-line"></span>
    </div>

    <!-- Buttons -->
    <div class="btn-group">

        <!-- Instagram DM -->
        <a href="https://ig.me/m/primalecommerce"
           target="_blank"
           rel="noopener noreferrer"
           class="btn btn-instagram">
            <span class="icon">📸</span>
            <span class="label">Instagram DM</span>
            <span class="arrow">→</span>
        </a>

        <!-- Telegram DM -->
        <a href="https://t.me/primalux0"
           target="_blank"
           rel="noopener noreferrer"
           class="btn btn-telegram">
            <span class="icon">✈️</span>
            <span class="label">Telegram DM</span>
            <span class="arrow">→</span>
        </a>

        <!-- WhatsApp Chat -->
        <a href="https://wa.link/5bqxd8"
           target="_blank"
           rel="noopener noreferrer"
           class="btn btn-whatsapp">
            <span class="icon">💬</span>
            <span class="label">WhatsApp Chat</span>
            <span class="arrow">→</span>
        </a>

    </div>

    <!-- Footer -->
    <div class="footer">
        <span class="status">
            <span class="status-dot"></span>
            Online
        </span>
        <span class="dot"></span>
        <span>Response within 2hrs</span>
    </div>

</div>

</body>
</html>
